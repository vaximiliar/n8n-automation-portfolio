name: Leonida GTA V vs VI Render
on:
  push:
    branches:
      - leonida-gta-video-render-20261118
permissions:
  contents: read
jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 24
    steps:
      - name: Setup
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
          python3 -m pip install --upgrade yt-dlp numpy pillow
      - name: Fetch both actual gameplay sources
        run: |
          mkdir -p footage output
          yt-dlp --no-playlist --force-ipv4 --retries 3 -f 'bv*[height<=480]+ba/b[height<=480]/b' --merge-output-format mp4 -o 'footage/gta5.%(ext)s' 'https://www.youtube.com/watch?v=N-xHcvug3WI'
          yt-dlp --no-playlist --force-ipv4 --retries 3 -f 'bv*[height<=480]+ba/b[height<=480]/b' --merge-output-format mp4 -o 'footage/gta6.%(ext)s' 'https://www.youtube.com/watch?v=3PiR0G3rVw8'
      - name: Build 17-second high-clarity gameplay split-screen
        shell: bash
        run: |
          cat > /tmp/render.py <<'PY'
          import glob, subprocess, math, numpy as np, wave, os
          from pathlib import Path
          from PIL import Image, ImageDraw, ImageFont
          out=Path('output');out.mkdir(exist_ok=True)
          srcs=[]
          for key in ['gta5','gta6']:
              matches=[x for x in glob.glob(f'footage/{key}.*') if x.split('.')[-1] in ('mp4','webm','mkv')]
              if not matches:raise RuntimeError(f'No video file: {key}')
              srcs.append(matches[0])
          def run(args):
              p=subprocess.run(args,stdout=subprocess.PIPE,stderr=subprocess.PIPE,text=True)
              if p.returncode:raise RuntimeError(f'{args[0]} {p.stderr[-2000:]}')
              return p.stdout.strip()
          def duration(path):
              return float(run(['ffprobe','-v','error','-show_entries','format=duration','-of','default=noprint_wrappers=1:nokey=1',path]))
          ds=[duration(s) for s in srcs]
          if min(ds)<35:raise RuntimeError(f'Source too short: {ds}')
          W,H=720,1280
          title=out/'over.png'
          im=Image.new('RGBA',(W,H),(0,0,0,0));d=ImageDraw.Draw(im)
          fonts=['/usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf','/usr/share/fonts/truetype/liberation2/LiberationSans-Bold.ttf']
          f=next((x for x in fonts if os.path.exists(x)),fonts[0])
          def t(x,y,text,size,fill):
              d.text((x,y),text,font=ImageFont.truetype(f,size),fill=fill)
          d.rounded_rectangle((15,12,705,94),radius=10,fill=(10,14,23,240))
          t(35,24,'GTA V  vs  GTA VI',45,(255,255,255,255))
          d.rounded_rectangle((15,114,245,161),radius=7,fill=(8,12,20,237))
          t(29,117,'GTA V   |   2013',26,(244,244,244,255))
          d.rounded_rectangle((15,666,266,716),radius=7,fill=(8,12,20,237))
          t(29,670,'GTA VI   |   2026',26,(246,246,246,255))
          d.rounded_rectangle((15,1204,705,1266),radius=7,fill=(10,14,23,235))
          t(30,1218,'WHICH FEELS MORE ALIVE?',32,(255,255,255,255))
          im.save(title)
          # True 16:9 video for both games. No cinematic pan, no fake footage, no zoom.
          # Each cut shows new non-overlapping source intervals.
          frac5=[.08,.16,.27,.38,.46,.54,.61,.67,.72,.78,.84,.91]
          frac6=[.06,.13,.19,.25,.31,.37,.43,.49,.55,.61,.67,.74]
          n=len(frac5); segdur=1.38
          paths=[]
          for i in range(n):
              starts=[max(3,min(ds[j]-2.0,ds[j]*[frac5,frac6][j][i])) for j in range(2)]
              p=out/f's_{i:02d}.mp4'
              filt=(
                  '[0:v]fps=30,scale=720:405:force_original_aspect_ratio=decrease,'
                  'pad=720:405:(ow-iw)/2:(oh-ih)/2:black,setsar=1[a];'
                  '[1:v]fps=30,scale=720:405:force_original_aspect_ratio=decrease,'
                  'pad=720:405:(ow-iw)/2:(oh-ih)/2:black,setsar=1[b];'
                  f'color=c=0x10151d:s=720x1280:r=30:d={segdur}[bg];'
                  '[bg][a]overlay=0:174:shortest=1[x];'
                  '[x][b]overlay=0:733:shortest=1[y];'
                  '[y][2:v]overlay=0:0:shortest=1,format=yuv420p[v]'
              )
              run(['ffmpeg','-y','-v','error','-ss',str(starts[0]),'-i',srcs[0],
                  '-ss',str(starts[1]),'-i',srcs[1],'-loop','1','-i',str(title),
                  '-filter_complex',filt,'-map','[v]','-t',str(segdur),
                  '-an','-r','30','-c:v','libx264','-preset','ultrafast','-crf','20','-pix_fmt','yuv420p',str(p)])
              paths.append(p)
          listfile=out/'concat.txt'
          listfile.write_text(''.join("file '"+str(p.resolve())+"'\n" for p in paths))
          joined=out/'silent.mp4'
          run(['ffmpeg','-y','-v','error','-f','concat','-safe','0','-i',str(listfile),'-c','copy',str(joined)])
          # Original electronic beat, synchronized to edits
          dur=n*segdur
          sr=44100
          ts=np.arange(int(dur*sr))/sr
          signal=np.zeros(len(ts),dtype=np.float64)
          rng=np.random.default_rng(2026)
          beat=60/130
          for beatno in range(math.ceil(dur/beat)):
              st=int(beatno*beat*sr)
              if st>=len(signal):continue
              x=np.arange(min(int(.24*sr),len(signal)-st))/sr
              kick=np.sin(2*np.pi*(55*x+18*x*np.exp(-24*x)))*np.exp(-19*x)
              signal[st:st+len(x)]+=kick*.53
              if beatno%2:
                  x=np.arange(min(int(.10*sr),len(signal)-st))/sr
                  signal[st:st+len(x)]+=rng.normal(0,.17,len(x))*np.exp(-33*x)
          for j in range(int(dur/segdur)):
              st=int(j*segdur*sr)
              x=np.arange(min(int(.08*sr),len(signal)-st))/sr
              signal[st:st+len(x)]+=.24*np.sin(2*np.pi*(240-140*x/.08)*x)*np.exp(-46*x)
          signal=np.tanh(signal*1.3)
          signal=signal/(np.max(np.abs(signal))+1e-6)*.81
          audio=out/'beat.wav'
          with wave.open(str(audio),'wb') as wf:
              wf.setframerate(sr);wf.setnchannels(1);wf.setsampwidth(2)
              wf.writeframes((signal*32767).astype('<i2').tobytes())
          final=out/'LEONIDA_GTA_V_VS_VI_REAL_GAMEPLAY.mp4'
          run(['ffmpeg','-y','-v','error','-i',str(joined),'-i',str(audio),'-map','0:v:0','-map','1:a:0',
               '-c:v','copy','-c:a','aac','-b:a','192k','-t',str(dur),'-movflags','+faststart',str(final)])
          print('OUTPUT:',final,'SIZE:',final.stat().st_size,flush=True)
          PY
          python3 /tmp/render.py
      - name: Upload resulting MP4
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: leonida-gta-comparison
          path: output/LEONIDA_GTA_V_VS_VI_REAL_GAMEPLAY.mp4
          if-no-files-found: warn
          retention-days: 7
